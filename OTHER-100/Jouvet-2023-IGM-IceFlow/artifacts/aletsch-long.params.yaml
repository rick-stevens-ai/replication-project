# @package _global_
# Longer / more aggressive replication run: invert thk + slidingco + arrhenius
# 2000 iterations with emulator retraining.

defaults:
- override /inputs:
  - oggm_shop
  - local
- override /processes:
  - data_assimilation
  - iceflow

core:
  hardware:
    visible_gpus: [0]

inputs:
  oggm_shop:
    RGI_ID: RGI2000-v7.0-G-11-02596
    dx: 100.0
    border: 30
    thk_source: consensus_ice_thickness
    vel_source: millan_ice_velocity
    incl_glathida: True
    preprocess: True

processes:
  data_assimilation:
    control_list: [thk, slidingco, arrhenius, usurf]
    cost_list: [velsurf, thk, icemask, usurf, divfluxfcz]
    optimization:
      nbitmin: 200
      nbitmax: 2000
      method: ADAM
      step_size: 0.5
      step_size_decay: 0.95
      retrain_iceflow_model: true
    fitting:
      usurfobs_std: 2.0
      velsurfobs_std: 1.0
      thkobs_std: 3.0
      divfluxobs_std: 1.0
    regularization:
      thk: 10.0
      slidingco: 1.0
      arrhenius: 10.0
      convexity_weight: 0.002
    output:
      freq: 100
      plot2d: false
      plot2d_live: false
      save_result_in_ncdf: geology-optimized.nc
      save_iterat_in_ncdf: true
  iceflow:
    physics:
      init_slidingco: 0.045
